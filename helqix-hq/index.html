const glassMat = new THREE.MeshStandardMaterial({ color: 0x3a3070, metalness: 0.6, roughness: 0.06, transparent: true, opacity: 0.28, side: THREE.DoubleSide, envMapIntensity: 0.7, depthWrite: false });

const animated = [];

// ---------------- curved glass blocks (per-floor groups so floors can be lifted away) ----------------

const jets = [];
function buildJets() {
  const o = [], v = [], l = [];
  for (const [x, y, z, vx, vy, vz, n, jit] of jets) for (let k = 0; k < n; k++) { const jy = vy + rr(-0.4, 0.4); const life = (jy + Math.sqrt(jy * jy + 19.6 * (y - 0.3))) / 9.8; o.push(x, y, z); v.push(vx + rr(-jit, jit), jy, vz + rr(-jit, jit)); l.push(rnd() * life, life, rr(0.1, 0.22)); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(o, 3)); g.setAttribute('aVel', new THREE.Float32BufferAttribute(v, 3)); g.setAttribute('aLife', new THREE.Float32BufferAttribute(l, 3));
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uTime: U.time },
    vertexShader: 'uniform float uTime; attribute vec3 aVel; attribute vec3 aLife; varying float vA; void main(){ float t = mod(uTime + aLife.x, aLife.y); vec3 p = position + aVel*t; p.y -= 4.9*t*t; vA = smoothstep(0.,0.05,t)*(1.0-smoothstep(aLife.y-0.1,aLife.y,t)); vec4 mv = modelViewMatrix*vec4(p,1.); gl_Position = projectionMatrix*mv; gl_PointSize = aLife.z*900.0/-mv.z; }',
    fragmentShader: 'varying float vA; void main(){ vec2 c = gl_PointCoord-0.5; float d = dot(c,c)*4.0; if(d>1.0) discard; gl_FragColor = vec4(0.55,0.75,1.3,(1.0-d)*vA*0.35); }' });

}

    blk.floors[R.f].add(g);
  }
}

  const setPart = (k, i, x, y, z, rx) => { tmp.compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, 0, 0)), new THREE.Vector3(1, 1, 1)); I[k].setMatrixAt(i, o.matrix.clone().multiply(tmp)); };
  animated.push((t, dt) => {
    for (const p of PEOPLE) {

      if (p.kind === 'z') { p.t = (p.t + dt * p.sp / 90) % 1; const dir = p.i % 2 ? 1 : -1, s = dir > 0 ? p.t : 1 - p.t; x = p.x + Math.sin(p.t * 6 + p.ph) * 0.3; z = p.z0 + (p.z1 - p.z0) * s; hd = dir > 0 ? 0 : Math.PI; }

// =====================================================================
//  CHERRY BLOSSOMS — recursive branching trees with flower-cluster cards
// =====================================================================
function blossomTex() {
  const S = 256, [c, g] = cnv(S, S);
  const flower = (x, y, r, rot, hue) => {
    for (let k = 0; k < 5; k++) { const a = rot + k * Math.PI * 2 / 5; g.save(); g.translate(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55); g.rotate(a); const gr = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.6); gr.addColorStop(0, `hsl(${hue},80%,93%)`); gr.addColorStop(1, `hsl(${hue},75%,80%)`); g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, r * 0.55, r * 0.4, 0, 0, 7); g.fill(); g.restore(); }
    g.fillStyle = '#b8325a'; g.beginPath(); g.arc(x, y, r * 0.18, 0, 7); g.fill();
    g.fillStyle = '#ffe08a'; for (let k = 0; k < 6; k++) { const a = rnd() * 7; g.fillRect(x + Math.cos(a) * r * 0.25, y + Math.sin(a) * r * 0.25, 2, 2); }
  };
  for (let i = 0; i < 26; i++) { const a = rnd() * 7, d = Math.sqrt(rnd()) * S * 0.36; flower(S / 2 + Math.cos(a) * d, S / 2 + Math.sin(a) * d, rr(22, 34), rnd() * 7, rr(330, 352)); }
  const t = tex(c); return t;
}
function petalTex() { const [c, g] = cnv(64, 64); g.fillStyle = '#ffd0e0'; g.beginPath(); g.ellipse(32, 32, 26, 16, 0, 0, 7); g.fill(); g.fillStyle = '#ffb3cb'; g.beginPath(); g.ellipse(36, 32, 10, 6, 0, 0, 7); g.fill(); return tex(c); }
function buildBlossoms() {
  const spots = [[-46, 30, 1.25], [-38, 46, 1.05], [-30, 16, 0.9], [-56, 14, 1.15], [-62, 40, 1.3], [-28, 72, 1.0], [46, 22, 1.05], [52, 34, 1.25], [58, 56, 1.4], [28, 66, 1.0], [64, 16, 1.1], [-72, 70, 1.5], [72, 82, 1.45], [-14, 92, 0.95], [-84, 22, 1.3], [86, 40, 1.3], [-50, 92, 1.2], [44, 96, 1.2]];
  const segs = [], tips = [], up = new THREE.Vector3(0, 1, 0);
  const branch = (p, dir, len, rad, depth) => {
    const end = p.clone().addScaledVector(dir, len);
    const g = new THREE.CylinderGeometry(rad * 0.68, rad, len, 7, 1); g.translate(0, len / 2, 0); g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(up, dir)); g.translate(p.x, p.y, p.z); segs.push(g);
    if (depth === 0) { tips.push(end); return; }
    const n = depth > 2 ? 3 : 2 + (rnd() < 0.5 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const d = dir.clone().add(new THREE.Vector3(rr(-0.9, 0.9), rr(-0.15, 0.55), rr(-0.9, 0.9))).normalize();
      if (d.y < 0.05) d.y = 0.05; d.normalize();
      branch(end, d, len * rr(0.62, 0.78), rad * 0.62, depth - 1);
    }
    if (depth <= 2) tips.push(end.clone().lerp(p, 0.4));
  };
  for (const [x, z, s] of spots) {
    const trunkLen = 2.6 * s, p0 = new THREE.Vector3(x, 0, z), d0 = new THREE.Vector3(rr(-0.15, 0.15), 1, rr(-0.15, 0.15)).normalize();
    branch(p0, d0, trunkLen, 0.36 * s, 0); tips.pop();
    const top = p0.clone().addScaledVector(d0, trunkLen);
    for (let k = 0; k < 3; k++) { const a = k * 2.1 + rnd(), d = new THREE.Vector3(Math.cos(a) * 0.8, 0.7, Math.sin(a) * 0.8).normalize(); branch(top, d, 2.1 * s, 0.22 * s, 4); }
    const ring = new THREE.Mesh(new THREE.CircleGeometry(4.2 * s, 40), new THREE.MeshStandardMaterial({ color: 0x241826, roughness: 0.9 })); ring.rotation.x = -Math.PI / 2; ring.position.set(x, 0.03, z); root.add(ring);
    for (let k = 0; k < 3; k++) { const a = k * 2.1, l = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.18, 10), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 1.6, 2.0), toneMapped: false })); l.position.set(x + Math.cos(a) * 1.3, 0.09, z + Math.sin(a) * 1.3); root.add(l); }
  }
  const bark = new THREE.Mesh(mergeGeometries(segs), new THREE.MeshStandardMaterial({ color: 0x2e2024, roughness: 0.92 })); root.add(bark);
  // flower-cluster cards around every twig tip
  const card = new THREE.PlaneGeometry(1, 1), bm = new THREE.MeshStandardMaterial({ map: blossomTex(), alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.8, emissive: 0xff8ab8, emissiveIntensity: 0.16 });
  const per = 9, inst = new THREE.InstancedMesh(card, bm, tips.length * per), m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color(); let i = 0;
  for (const tp of tips) for (let k = 0; k < per; k++) { const s = rr(0.7, 1.25); m.compose(new THREE.Vector3(tp.x + rr(-0.6, 0.6), tp.y + rr(-0.35, 0.45), tp.z + rr(-0.6, 0.6)), q.setFromEuler(new THREE.Euler(rnd() * 3, rnd() * 3, rnd() * 3)), new THREE.Vector3(s, s, s)); inst.setMatrixAt(i, m); inst.setColorAt(i, c.setHSL(0.94 + rr(-0.02, 0.03), rr(0.2, 0.5), rr(0.85, 1.0))); i++; }
  inst.count = i; root.add(inst);
  // fallen petals on the ground
  const pm = new THREE.MeshStandardMaterial({ map: petalTex(), transparent: true, alphaTest: 0.3, roughness: 0.8, side: THREE.DoubleSide });
  const PN = spots.length * 220, fp = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.12, 0.08), pm, PN); let j = 0;
  for (const [x, z, s] of spots) for (let k = 0; k < 220; k++) { const a = rnd() * 7, d = Math.sqrt(rnd()) * 5.5 * s; m.compose(new THREE.Vector3(x + Math.cos(a) * d, 0.05, z + Math.sin(a) * d), q.setFromEuler(new THREE.Euler(-Math.PI / 2, 0, rnd() * 7)), new THREE.Vector3(1, 1, 1)); fp.setMatrixAt(j++, m); }
  root.add(fp);
  // drifting petals
  const P = MOBILE ? 600 : 1600, pp = new Float32Array(P * 3), ph = new Float32Array(P);
  for (let k = 0; k < P; k++) { const s = spots[k % spots.length]; pp[k * 3] = s[0] + rr(-5, 5); pp[k * 3 + 1] = rr(0, 8); pp[k * 3 + 2] = s[1] + rr(-5, 5); ph[k] = rnd() * 100; }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pp, 3)); pg.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const ptm = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uTime: U.time },
    vertexShader: 'uniform float uTime; attribute float ph; varying float vA; void main(){ vec3 p = position; float t = mod(uTime*0.5 + ph, 12.0); p.y = position.y + 4.0 - t*0.9; p.x += sin(t*1.3+ph)*1.0 + t*0.35; p.z += cos(t*0.9+ph)*0.7; vA = smoothstep(0.,1.,t)*smoothstep(12.,9.,t)*step(0.,p.y); vec4 mv = modelViewMatrix*vec4(p,1.); gl_Position = projectionMatrix*mv; gl_PointSize = 34.0/-mv.z; }',
    fragmentShader: 'varying float vA; void main(){ vec2 c = gl_PointCoord-0.5; c.y *= 1.6; float d = dot(c,c)*4.0; if(d>1.0) discard; gl_FragColor = vec4(1.0,0.78,0.86,(1.0-d)*vA*0.85); }' });
  const petals = new THREE.Points(pg, ptm); petals.frustumCulled = false; root.add(petals);
}

// =====================================================================
//  EXPLORER — cutaway + fly-to for every room and system
// =====================================================================
const AREAS = [];
function setCut(a) {
  for (const id in BLOCKS) { const B = BLOCKS[id], cut = a && a.blockId === id; B.floors.forEach((g, f) => { g.visible = !cut || f <= a.f; }); B.roof.visible = !cut; }
  for (const id of ['A', 'R', 'L']) for (const o of HIDE[id]) o.visible = !(a && a.blockId === id);
  for (const o of HIDE.AR) o.visible = !(a && (a.blockId === 'A' || a.blockId === 'R'));
  const fabCut = a && a.kind === 'fab';
  FABG.roof.visible = !fabCut; FABG.front.visible = !fabCut; FABG.clean.visible = !(fabCut && a.level === 'sub');
  if (beams) beams.visible = !a && $('tBeam').getAttribute('aria-pressed') === 'true';
}
const AREA_HIDE = [];
function buildAreas() {
  ROOMS.forEach(R => { const B = BLOCKS[R.blockId], dist = R.blockId === 'L' ? 30 : 26; AREAS.push({ ...R, group: { A: 'Atrium', L: 'West wing', R: 'East tower' }[R.blockId], floorLabel: `Floor ${R.f + 1}`, cam: R.center.clone().addScaledVector(R.out, dist).add(new THREE.Vector3(0, 20, 0)), tgt: R.center.clone() }); });
  FAB_ROOMS.forEach(R => { const mx = (R.x0 + R.x1) / 2, y = R.level === 'sub' ? 0 : FAB.sub, wide = R.level === 'sub'; AREAS.push({ ...R, kind: 'fab', group: 'Fab 1', floorLabel: R.level === 'sub' ? 'Sub-fab' : 'Cleanroom', cam: new THREE.Vector3(mx + (wide ? 0 : 6), y + (wide ? 70 : 34), FAB.z1 + (wide ? 50 : 26)), tgt: new THREE.Vector3(mx, y + 2, (FAB.z0 + FAB.z1) / 2) }); });
  YARD_ROOMS.forEach(R => { const mz = (R.z0 + R.z1) / 2; AREAS.push({ ...R, kind: 'yard', group: 'Utility yard', floorLabel: 'Outdoor plant', cam: new THREE.Vector3(YARD.x1 + 26, 34, mz + 30), tgt: new THREE.Vector3((YARD.x0 + YARD.x1) / 2, 4, mz) }); });
}
let currentArea = null;
function openArea(a) {
  currentArea = a; setCut(a);
  const sc = camera.aspect < 1 ? 1.5 : 1, p = a.cam.clone().sub(a.tgt).multiplyScalar(sc).add(a.tgt);
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p, t: a.tgt.clone(), s: performance.now(), d: 2200 };
  $('cardEye').textContent = `${a.group} · ${a.floorLabel}`; $('cardName').textContent = a.name; $('cardDesc').textContent = a.desc; $('card').hidden = false;
  document.querySelectorAll('.area').forEach(el => el.setAttribute('aria-current', String(el.dataset.i == AREAS.indexOf(a))));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', 'false'));
}
function closeArea() { currentArea = null; setCut(null); $('card').hidden = true; document.querySelectorAll('.area').forEach(el => el.setAttribute('aria-current', 'false')); }
function explorerUI() {
  const list = $('areaList'); let grp = '';
  AREAS.forEach((a, i) => {
    if (a.group !== grp) { grp = a.group; const h = document.createElement('h4'); h.textContent = grp; list.appendChild(h); }
    const b = document.createElement('button'); b.className = 'area'; b.dataset.i = i; b.innerHTML = `<span>${a.name}</span><small>${a.floorLabel}</small>`; b.addEventListener('click', () => { openArea(a); if (MOBILE) $('explorer').hidden = true; }); list.appendChild(b);
  });
  $('tExplore').addEventListener('click', () => { const ex = $('explorer'); ex.hidden = !ex.hidden; $('tExplore').setAttribute('aria-pressed', String(!ex.hidden)); });
  $('cardClose').addEventListener('click', () => { closeArea(); goView('front'); });
  $('cardPrev').addEventListener('click', () => openArea(AREAS[(AREAS.indexOf(currentArea) - 1 + AREAS.length) % AREAS.length]));
  $('cardNext').addEventListener('click', () => openArea(AREAS[(AREAS.indexOf(currentArea) + 1) % AREAS.length]));
}

// ---------------- views, UI, loop ----------------
const VIEWS = { fab: [[-95, 62, -20], [5, 6, -120]], front: [[0, 7, 74], [0, 17, -4]], wide: [[-120, 45, 150], [0, 18, -5]], aerial: [[30, 170, 120], [0, 0, 0]], sculpture: [[18, 6, 62], [38, 9, 42]] };
let fly = null;
function goView(k) {
  const [p, t] = VIEWS[k], sc = camera.aspect < 1 ? 1.7 : 1, tv = new THREE.Vector3(...t), pv = new THREE.Vector3(...p).sub(tv).multiplyScalar(sc).add(tv);
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p: pv, t: tv, s: performance.now(), d: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 2200 };
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === k)));
}
function toggle(id, fn) { const b = $(id); b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); fn(on); }); }
function ui() {
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { closeArea(); goView(b.dataset.view); }));
  toggle('tFest', (on) => { U.fest.value = on ? 1 : 0; });
  toggle('tFire', (on) => { FW.on = on; });
  toggle('tBeam', (on) => { beams.visible = on; });
  toggle('tOrbit', (on) => { controls.autoRotate = on; });
  renderer.domElement.addEventListener('pointerdown', () => { fly = null; });
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); reflector.getRenderTarget().setSize(Math.round(innerWidth * 0.75), Math.round(innerHeight * 0.75)); });
}
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  if (window.HELQIX && window.HELQIX.paused) return;
  step(Math.min(clock.getDelta(), 0.05));
  composer.render();
}
function step(dt) {
  const t = clock.elapsedTime; U.time.value = t;
  for (const f of animated) f(t, dt);
  if (fly) { const k = Math.min(1, (performance.now() - fly.s) / fly.d), e = k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2; camera.position.lerpVectors(fly.p0, fly.p, e); controls.target.lerpVectors(fly.t0, fly.t, e); if (k >= 1) fly = null; }
  controls.update();
}

async function boot() {
  try {
    if (!renderer.capabilities.isWebGL2) throw new Error('WebGL 2 is not available');
    try { await Promise.race([document.fonts.load('600 64px Sora'), new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
    progress(0.1, 'Raising the glass atrium'); await tick(); buildEnv(); buildArchitecture(); fitOutBlocks();
    progress(0.3, 'Commissioning Fab 1 and the utility yard'); await tick(); buildFab(); buildYard();
    progress(0.45, 'Polishing the wet plaza'); await tick(); buildPlaza(); buildJets();
    progress(0.65, 'Blooming the cherry trees'); await tick(); buildBlossoms(); buildPeople(); buildAreas();
    progress(0.85, 'Aiming the sky beams'); await tick(); buildSky(); buildFireworks();
    scene.add(new THREE.HemisphereLight(0x6a5cff, 0x140a1e, 0.6));
    const key = new THREE.PointLight(0xffb070, 220, 70, 1.8); key.position.set(0, 10, 16); scene.add(key);
    const fill = new THREE.PointLight(0x8a6bff, 260, 90, 1.8); fill.position.set(-40, 20, 30); scene.add(fill);
    const fill2 = new THREE.PointLight(0x4fb4ff, 220, 90, 1.8); fill2.position.set(45, 18, 30); scene.add(fill2);
    ui(); explorerUI();
    camera.position.set(0, 60, 260); controls.target.set(0, 18, 0);
    renderer.compile(scene, camera);
    progress(1, 'Lights on'); $('loader').classList.add('done'); setTimeout(() => $('loader').remove(), 900);
    goView('front'); frame();
    window.HELQIX = { THREE, AREAS, openArea, closeArea, paused: false, scene, camera, controls, VIEWS, snap: (k, t = 6) => { fly = null; const [p, q] = VIEWS[k]; camera.position.set(...p); controls.target.set(...q); controls.update(); clock.elapsedTime = t; U.time.value = t; for (let i = 0; i < 40; i++) { clock.elapsedTime += 0.05; step(0); } composer.render(); return renderer.domElement.toDataURL('image/jpeg', 0.85); } };
  } catch (err) {
    console.error(err);
    $('ldt').textContent = `This scene needs WebGL 2 with hardware acceleration (${String(err.message || err).slice(0, 80)}).`;
  }
}
boot();
