<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>TRUGS Headquarters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Italiana&display=swap">
<style>
/* Layout: full-bleed WebGL stage; floating graphite control rail on the left, suite dossier card bottom-right, bottom sheet on phones */
:root {
  --bg: #0b0d10;
  --ink: #ece7dc;
  --ink-2: #b1ab9f;
  --ink-3: #77736a;
  --panel: rgba(15, 17, 21, 0.80);
  --panel-solid: #121418;
  --raise: rgba(236, 231, 220, 0.06);
  --raise-2: rgba(236, 231, 220, 0.11);
  --line: rgba(236, 231, 220, 0.13);
  --brass: #c9a45c;
  --brass-hi: #e6c98e;
  --brass-ink: #1a1408;
  --f-display: 'Italiana', 'Didot', 'Bodoni 72', Georgia, serif;
  --f-body: 'Archivo', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }

/* brand */
.scrim { position: fixed; z-index: 4; inset: 0 0 auto 0; height: calc(env(safe-area-inset-top, 0px) + 130px); pointer-events: none; background: linear-gradient(rgba(8, 10, 13, .62), rgba(8, 10, 13, .28) 55%, rgba(8, 10, 13, 0)); }
.brand {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  left: var(--gutter-l);
  display: grid; gap: 2px; pointer-events: none;
  text-shadow: 0 1px 12px rgba(0,0,0,.55);
}
.brand .mark { font-family: var(--f-display); font-size: 34px; letter-spacing: .32em; line-height: 1; color: var(--ink); }
.brand .sub { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(236, 231, 220, .9); }

/* control rail */
.panel {
  position: fixed; z-index: 6;
  top: calc(env(safe-area-inset-top, 0px) + 92px);
  left: var(--gutter-l);
  width: 300px; max-height: calc(100% - 130px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
  overflow: hidden;
}
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button {
  background: none; border: 0; padding: 12px 6px 11px;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
  border-bottom: 2px solid transparent; transition: color .2s, border-color .2s;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
.pane { padding: 14px 14px 16px; overflow-y: auto; display: grid; gap: 14px; align-content: start; min-height: 0; }
.pane h3 { margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
.group { display: grid; gap: 8px; }
.view-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn {
  background: var(--raise); border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 10px; text-align: left; font-size: 12.5px; line-height: 1.25;
  transition: background .2s, border-color .2s;
}
.btn:hover { background: var(--raise-2); }
.btn.on { border-color: var(--brass); background: rgba(201,164,92,.14); }
.btn small { display: block; font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); margin-top: 2px; letter-spacing: .04em; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; text-align: center; }
.btn.primary:hover { background: var(--brass-hi); }
.btn.wide { width: 100%; text-align: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { background: none; border: 0; border-radius: 7px; padding: 7px 4px; font-size: 12px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); font-weight: 600; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.toggle input { appearance: none; width: 34px; height: 20px; border-radius: 20px; background: var(--raise-2); border: 1px solid var(--line); position: relative; cursor: pointer; transition: background .2s; flex: none; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink-2); transition: transform .2s, background .2s; }
.toggle input:checked { background: rgba(201,164,92,.35); }
.toggle input:checked::after { transform: translateX(14px); background: var(--brass-hi); }
.note { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-2); }

/* elevator panel */
.elevator {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 14px; border-radius: 12px;
  background: linear-gradient(160deg, #23262c, #16181c);
  border: 1px solid var(--line);
}
.elevator button {
  aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  border: 1px solid rgba(230,201,142,.35);
  background: radial-gradient(circle at 35% 30%, #3a3a38, #1d1d1c 70%);
  font-family: var(--f-mono); font-size: 13px; color: var(--ink-2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.4);
  display: grid; place-items: center; transition: color .2s, box-shadow .2s, border-color .2s;
}
.elevator button:hover { color: var(--ink); border-color: var(--brass-hi); }
.elevator button.on { color: #fff6df; border-color: var(--brass-hi); box-shadow: 0 0 0 2px rgba(230,201,142,.25), 0 0 16px rgba(230,201,142,.55), inset 0 0 10px rgba(230,201,142,.35); }

/* suite list */
.search { width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font-size: 13px; }
.search::placeholder { color: var(--ink-3); }
.room-list { display: grid; gap: 12px; }
.room-floor { display: grid; gap: 4px; }
.room-floor h4 { margin: 0 0 2px; font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.room-item { display: grid; grid-template-columns: 38px 1fr; align-items: baseline; gap: 8px; text-align: left; background: none; border: 0; border-radius: 7px; padding: 6px 8px; }
.room-item:hover { background: var(--raise); }
.room-item.on { background: rgba(201,164,92,.16); }
.room-item .code { font-family: var(--f-mono); font-size: 11px; color: var(--brass-hi); }
.room-item .nm { font-size: 13px; line-height: 1.3; min-width: 0; }

/* dossier card */
.card {
  position: fixed; z-index: 6;
  right: var(--gutter-r);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
  width: 340px; max-width: calc(100% - 32px);
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 18px 16px; display: grid; gap: 10px;
  box-shadow: 0 18px 50px rgba(0,0,0,.4);
}
.card .eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi); }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.05; text-wrap: balance; padding-right: 22px; }
.card p { margin: 0; color: var(--ink-2); line-height: 1.5; font-size: 13px; }
.specs { margin: 2px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.specs div { min-width: 0; }
.specs dt { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.specs dd { margin: 2px 0 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.swatches { display: flex; gap: 6px; }
.swatches i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); }
.card-actions { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; }
.card-actions .btn { text-align: center; }
.close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--raise); font-size: 18px; line-height: 1; color: var(--ink-2); }
.close:hover { background: var(--raise-2); color: var(--ink); }

.badge {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; display: flex; gap: 10px; align-items: baseline;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.badge b { font-family: var(--f-mono); font-weight: 500; color: var(--brass-hi); letter-spacing: .08em; }
.badge span { font-size: 12.5px; color: var(--ink-2); }

.tip {
  position: fixed; z-index: 7; pointer-events: none;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; white-space: nowrap; transform: translate(14px, 14px);
}
.tip b { font-family: var(--f-mono); font-weight: 500; color: var(--brass-hi); margin-right: 6px; }
.hint {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; color: rgba(236,231,220,.72);
  text-shadow: 0 1px 8px rgba(0,0,0,.7); white-space: nowrap; pointer-events: none;
}
.panel-toggle {
  display: none; position: fixed; z-index: 7;
  right: var(--gutter-r); top: calc(env(safe-area-inset-top, 0px) + 18px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
}

/* loader */
#loader {
  position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; gap: 18px; justify-items: center;
  background: radial-gradient(ellipse at 50% 40%, #1a1d22, #0b0d10 70%);
  transition: opacity .8s ease;
}
#loader.done { opacity: 0; pointer-events: none; }
.ld-mark { font-family: var(--f-display); font-size: 56px; letter-spacing: .38em; padding-left: .38em; }
.ld-bar { width: 240px; max-width: 70vw; height: 2px; background: var(--raise-2); border-radius: 2px; overflow: hidden; }
.ld-bar i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .25s; }
#ldText { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; color: var(--ink-2); text-align: center; min-height: 1.4em; }
.ld-err { color: #f0a58f; max-width: 420px; line-height: 1.5; }

@media (max-width: 720px) {
  .brand .mark { font-size: 26px; }
  .brand { max-width: calc(100% - var(--gutter-l) - var(--gutter-r) - 150px); }
  .brand .sub { font-size: 9.5px; line-height: 1.5; }
  .panel-toggle { display: block; }
  .panel {
    top: auto; left: 0; right: 0; width: auto;
    bottom: 0; border-radius: 16px 16px 0 0; max-height: 46%;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .panel.collapsed { display: none; }
  .card { left: var(--gutter-l); right: var(--gutter-r); width: auto; max-width: none; bottom: calc(46% + 10px); padding: 14px; gap: 8px; }
  .panel.collapsed ~ .card { bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .card h2 { font-size: 24px; }
  .card p { display: none; }
  .elevator { grid-template-columns: repeat(5, 1fr); }
  .hint { display: none; }
  .badge { top: calc(env(safe-area-inset-top, 0px) + 64px); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<canvas id="scene" tabindex="0" aria-label="3D model of the TRUGS headquarters tower"></canvas>

<div class="scrim" aria-hidden="true"></div>
<header class="brand">
  <div class="mark">TRUGS</div>
  <div class="sub">Headquarters Tower · 20 floors · 50 suites</div>
</header>

<button id="panelToggle" class="panel-toggle" aria-expanded="true" aria-controls="panel">Controls</button>

<nav id="panel" class="panel" aria-label="Tower controls">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-views" aria-selected="true" data-tab="views">Views</button>
    <button role="tab" id="tab-floors" aria-selected="false" data-tab="floors">Floors</button>
    <button role="tab" id="tab-rooms" aria-selected="false" data-tab="rooms">Suites</button>
  </div>

  <section class="pane" data-pane="views" role="tabpanel" aria-labelledby="tab-views">
    <div class="group">
      <h3>Camera</h3>
      <div class="view-grid" id="viewGrid">
        <button class="btn on" data-view="overview">Tower<small>overview</small></button>
        <button class="btn" data-view="fountain">Entrance<small>fountain court</small></button>
        <button class="btn" data-view="garden">Rear garden<small>foundation terraces</small></button>
        <button class="btn" data-view="crown">Crown<small>rooftop signage</small></button>
        <button class="btn" data-view="street">Street<small>approach</small></button>
        <button class="btn" data-view="aerial">Site plan<small>from above</small></button>
      </div>
    </div>
    <div class="group">
      <h3>Light</h3>
      <div class="seg" id="timeSeg">
        <button data-time="day" aria-pressed="true">Day</button>
        <button data-time="sunset" aria-pressed="false">Golden hour</button>
        <button data-time="night" aria-pressed="false">Night</button>
      </div>
    </div>
    <div class="group">
      <h3>Options</h3>
      <label class="toggle" for="optOrbit">Slow orbit <input type="checkbox" id="optOrbit"></label>
      <label class="toggle" for="optGlow">Light bloom <input type="checkbox" id="optGlow" checked></label>
      <label class="toggle" for="optShadow">Sun shadows <input type="checkbox" id="optShadow" checked></label>
    </div>
    <button class="btn primary wide" id="tourBtn">Start suite tour</button>
    <button class="btn wide" id="glbBtn">Export model (.glb)</button>
  </section>

  <section class="pane" data-pane="floors" role="tabpanel" aria-labelledby="tab-floors" hidden>
    <p class="note">Press a floor to lift every floor above it away and look inside.</p>
    <div class="elevator" id="elevator"></div>
    <button class="btn wide" id="allFloors">Show the full tower</button>
  </section>

  <section class="pane" data-pane="rooms" role="tabpanel" aria-labelledby="tab-rooms" hidden>
    <input class="search" id="roomSearch" type="search" placeholder="Search 50 suites" aria-label="Search suites">
    <div class="room-list" id="roomList"></div>
  </section>
</nav>

<aside id="card" class="card" hidden aria-live="polite">
  <button class="close" id="cardClose" aria-label="Close suite details">×</button>
  <div class="eyebrow" id="cardEyebrow"></div>
  <h2 id="cardName"></h2>
  <p id="cardDesc"></p>
  <dl class="specs">
    <div><dt>Use</dt><dd id="cardType"></dd></div>
    <div><dt>Floor area</dt><dd id="cardArea"></dd></div>
    <div><dt>Floor finish</dt><dd id="cardFloor"></dd></div>
    <div><dt>Walls</dt><dd id="cardWall"></dd></div>
  </dl>
  <div class="swatches" id="cardSwatches"></div>
  <div class="card-actions">
    <button class="btn" id="prevRoom" aria-label="Previous suite">‹</button>
    <button class="btn" id="enterRoom">Walk in</button>
    <button class="btn" id="nextRoom" aria-label="Next suite">›</button>
  </div>
</aside>

<div class="badge" id="badge" hidden><b id="badgeNum"></b><span id="badgeText"></span></div>
<div class="tip" id="tip" hidden></div>
<div class="hint" id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan · Click the tower to open a suite</div>

<div id="loader">
  <div class="ld-mark">TRUGS</div>
  <div class="ld-bar"><i id="ldFill"></i></div>
  <div id="ldText">Pouring the foundation</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   TRUGS HEADQUARTERS — procedural 3D model
   20 floors · 50 individually designed suites · entrance fountain court
   · terraced granite foundation garden at the rear.
   Everything (textures included) is generated in code: no image files.
   ===================================================================== */

// ---------- building constants (metres) ----------
const FLOORS = 20;
const BASE = 3;            // height of the granite podium (the foundation plinth)
const GH = 6;              // ground floor-to-floor
const FH = 4.2;            // typical floor-to-floor
const PLENUM = 0.6;        // slab + ceiling void
const HX = 22, HZ = 14;    // half footprint at the glass line
const IN = 0.05;           // glass inner offset
const floorY = (i) => BASE + (i === 0 ? 0 : GH + (i - 1) * FH);
const clearH = (i) => (i === 0 ? GH : FH) - PLENUM;
const ROOF_Y = floorY(FLOORS);
const IS_MOBILE = matchMedia('(max-width: 720px)').matches || /Mobi|Android/i.test(navigator.userAgent);
const D2R = Math.PI / 180;

// ---------- seeded randomness ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RND = mulberry32(7);
const rnd = () => RND();
const rr = (a, b) => a + (b - a) * RND();
const pick = (arr) => arr[Math.floor(RND() * arr.length)];
const seedRnd = (s) => { RND = mulberry32(s); };
const spread = (n, a, b) => n === 1 ? [(a + b) / 2] : Array.from({ length: n }, (_, i) => a + (b - a) * i / (n - 1));

// ---------- colour helpers ----------
const _c = new THREE.Color();
function hexRGB(h) { return [(h >> 16) & 255, (h >> 8) & 255, h & 255]; }
function rgba(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function shadeA(c, k) { return k >= 0 ? c.map(v => v + (255 - v) * k) : c.map(v => v * (1 + k)); }
function shadeHex(h, k) { const c = shadeA(hexRGB(h), k); return ((c[0] | 0) << 16) | ((c[1] | 0) << 8) | (c[2] | 0); }
function mixHex(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return ((A[0] + (B[0] - A[0]) * t) << 16) | ((A[1] + (B[1] - A[1]) * t) << 8) | (A[2] + (B[2] - A[2]) * t | 0); }
const cssHex = (h) => '#' + h.toString(16).padStart(6, '0');

// =====================================================================
//  PROCEDURAL TEXTURES (canvas)
// =====================================================================
const TS = IS_MOBILE ? 256 : 512;
let ANISO = 8;
function cnv(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', { willReadFrequently: true })]; }
function tex(c, { srgb = true, rep = true } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = ANISO;
  return t;
}
function speckle(g, w, h, amt, r) {
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(im, 0, 0);
}
function wrap9(s, fn) { for (const dx of [-s, 0, s]) for (const dy of [-s, 0, s]) fn(dx, dy); }
function blotches(g, s, base, n, amp, r, rmin = 30, rmax = 140, alpha = 0.1) {

  const shelves = Math.max(2, Math.round(h / 0.38));

    const y0 = s * (h - 0.03) / shelves + 0.03, sh = (h - 0.03) / shelves - 0.05;

  else if (mons >= 3) { for (const [sx, a] of [[-0.62, 0.45], [0, 0], [0.62, -0.45]]) monitor(b, sx, h, -d / 2 + 0.26 + Math.abs(sx) * 0.12, a, 0.58); if (mons >= 6) for (const [sx, a] of [[-0.62, 0.45], [0, 0], [0.62, -0.45]]) monitor(b, sx, h + 0.4, -d / 2 + 0.26 + Math.abs(sx) * 0.12, a, 0.58); }

  for (const x of [-7.5, 7.5]) { firePit(b, x, -0.8, 1.0); for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 + 0.3, cx = x + Math.cos(a) * 2.2, cz = -0.8 + Math.sin(a) * 2.2; chair(b, cx, cz, faceTo(cx, cz, x, -0.8), { fabric: P.fabric, wood: P.wood }, 'lounge'); } }
  spread(8, -hl + 2, hl - 2).forEach(x => chair(b, x, -hs + 1.4, Math.PI, { fabric: P.fabric2, wood: P.wood }, 'chaise'));
  b.cyl(1.9, 1.05, 0, 0, 2.6, P.wood, 'satin', 32); b.cyl(2.05, 0.05, 0, 1.05, 2.6, P.stone, 'gloss', 32); b.add(G.tor(1.92, 0.025, Math.PI * 2, 4, 64), [2.6, 2.0, 1.2], 'light', 0, 0.12, 2.6, Math.PI / 2);
  b.cyl(0.6, 2.2, 0, 1.1, 2.6, [1.6, 1.2, 0.7], 'light', 20);
  for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; chair(b, Math.cos(a) * 2.6, 2.6 + Math.sin(a) * 2.6, faceTo(Math.cos(a) * 2.6, 2.6 + Math.sin(a) * 2.6, 0, 2.6), { fabric: P.accent }, 'barstool'); }
  for (const x of [-10.5, 10.5]) { rug(b, x, 3.8, 4.2, 3.4, P.fabric2, P.accent); sofa(b, x, 5.0, Math.PI, 2.8, { fabric: P.fabric, accent: P.accent }); coffeeTable(b, x, 3.8, 0, 1.0, 1.0, { top: P.stone }, 'round'); }
  b.box(0.8, 0.5, S - 3, hl - 0.6, 0, 0, P.stone, 'satin'); b.box(0.7, 0.02, S - 3.2, hl - 0.6, 0.48, 0, 0x2c7f99, 'gloss'); b.box(0.02, 0.4, S - 3, hl - 1.01, 0.05, 0, [0.4, 1.6, 2.4], 'light');
  for (const sx of [-1, 1]) for (const z of [-hs + 0.9, hs - 0.9]) plant(b, sx * (hl - 1.6), z, 'palm', 1.6, P.stone);
  for (let i = 0; i < 14; i++) pendant(b, rr(-hl + 2, hl - 2), H, rr(-hs + 2, hs - 2), 'globe', 0, rr(0.6, 1.4), rr(0.6, 1.1));
};

const JET = { o: [], v: [], l: [] };
function jet(ox, oy, oz, vx, vy, vz, n, { jit = 0.12, jitY = 0.2, yEnd = 0.4, size = 0.11 } = {}) {
  size *= 1.55; n = Math.round(n * 1.25);

    JET.o.push(ox, oy, oz); JET.v.push(jx, jy, jz); JET.l.push(rnd() * life, life, size * (0.6 + rnd() * 0.8));
  }
}
function buildJets() {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(JET.o, 3));
  g.setAttribute('aVel', new THREE.Float32BufferAttribute(JET.v, 3));
  g.setAttribute('aLife', new THREE.Float32BufferAttribute(JET.l, 3));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 400);
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: U.time, uScale: { value: 600 }, uColor: { value: new THREE.Color(0.85, 0.93, 1.0) }, uOpacity: { value: 0.55 } },
    vertexShader: `uniform float uTime; uniform float uScale; attribute vec3 aVel; attribute vec3 aLife; varying float vA;
      void main(){ float t = mod(uTime + aLife.x, aLife.y); vec3 p = position + aVel * t; p.y -= 4.9 * t * t;
        vA = smoothstep(0.0, 0.05, t) * (1.0 - smoothstep(aLife.y - 0.1, aLife.y, t));
        vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = max(1.0, aLife.z * uScale / -mv.z); }`,
    fragmentShader: `uniform vec3 uColor; uniform float uOpacity; varying float vA;
      void main(){ vec2 c = gl_PointCoord - 0.5; float d = dot(c, c) * 4.0; if (d > 1.0) discard; gl_FragColor = vec4(uColor, (1.0 - d) * vA * uOpacity); }`,
  });

}

function setTime(name) {

  sun.color.set(P.sun); sun.intensity = P.sunI;
  hemi.color.set(P.hs); hemi.groundColor.set(P.hg); hemi.intensity = P.hi;
  renderer.toneMappingExposure = P.exp;
  for (const s of [sky, skyEnv]) { const u = s.material.uniforms; u.turbidity.value = P.turb ?? 3; u.rayleigh.value = P.ray ?? 1; u.mieCoefficient.value = P.mie ?? 0.005; u.mieDirectionalG.value = P.mieG ?? 0.8; u.sunPosition.value.copy(dir); }
  const night = !!P.moon;

  skyEnv.visible = !night; envScene.getObjectByName('envNight').visible = night;
  const old = scene.environment; scene.environment = pmrem.fromScene(envScene, 0.02, 1, 4000).texture; old?.dispose?.();

function initComposer() {
  const w = innerWidth, h = innerHeight;
  const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h);

  bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.4, 0.5, 0.92); composer.addPass(bloom);
  composer.addPass(new OutputPass());
}

function applyViewOffset() {
  const w = innerWidth, h = innerHeight, panel = $('panel'), open = !panel.classList.contains('collapsed');
  if (w > 720 && open) camera.setViewOffset(w, h, -Math.min(170, w * 0.12), 0, w, h);
  else if (w <= 720 && open) camera.setViewOffset(w, h, 0, Math.round(h * 0.2), w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; applyViewOffset();
  renderer.setSize(w, h, false); composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h);
  if (SITE.jets) SITE.jets.material.uniforms.uScale.value = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * D2R / 2));

// ---------- camera flights ----------
const ease = (k) => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function flyTo(pos, target, dur = 1.8, via = null, done = null) {

}
const V = (a) => new THREE.Vector3(...a);
const aspectK = () => (camera.aspect < 1 ? 1.75 : 1);
function goView(name) {
  exitRoom(false); setCut(null);

  flyTo(p, t, 2.0);
  document.querySelectorAll('#viewGrid .btn').forEach(b => b.classList.toggle('on', b.dataset.view === name));
}

// ---------- floors / cutaway ----------
function setCut(n) {
  STATE.cut = n;
  BUILD.floors.forEach((f, i) => { f.grp.visible = n == null || i <= n; if (f.glass) f.glass.material = (n != null && i === n) ? EM.glassCut : EM.glass; });
  BUILD.crown.visible = n == null;
  renderer.shadowMap.needsUpdate = true;
  document.querySelectorAll('#elevator button').forEach(b => b.classList.toggle('on', Number(b.dataset.floor) === n));
  const badge = $('badge');
  if (n == null) { badge.hidden = true; return; }
  const list = SUITES.filter(s => s.f === n + 1);
  $('badgeNum').textContent = n === 0 ? 'L · 01' : pad2(n + 1);
  $('badgeText').textContent = list.map(s => s.n).join(' · ');
  badge.hidden = false;
}
function viewFloor(n, fly = true) {
  exitRoom(false); setCut(n);
  const y = floorY(n), k = aspectK();
  if (fly) flyTo(new THREE.Vector3(34 * k, y + 30 * k, 48 * k), new THREE.Vector3(0, y + 1, 0), 1.6);
  document.querySelectorAll('#viewGrid .btn').forEach(b => b.classList.remove('on'));
}

// ---------- suites ----------
const toWorld = (s, x, y, z) => new THREE.Vector3(x, y, z).applyMatrix4(s.M);
function selectSuite(s, { enter = false, fly = true } = {}) {
  STATE.suite = s;
  const c = $('card');
  $('cardEyebrow').textContent = `Floor ${pad2(s.f)} · Suite ${s.code}`;
  $('cardName').textContent = s.n;
  $('cardDesc').textContent = s.d;
  $('cardType').textContent = s.use;
  $('cardArea').textContent = `${s.area} m²`;
  $('cardFloor').textContent = FLOOR_NAMES[s.fl] ?? s.fl;
  $('cardWall').textContent = s.wl ? (WALL_NAMES[s.wl] ?? s.wl) : 'Painted plaster';
  $('cardSwatches').innerHTML = [s.P.accent, s.P.fabric, s.P.fabric2, s.P.wood, s.P.stone].filter(v => v != null).slice(0, 5).map(h => `<i style="background:${cssHex(h)}" title="${cssHex(h)}"></i>`).join('');
  c.hidden = false;
  document.querySelectorAll('.room-item').forEach(b => b.classList.toggle('on', Number(b.dataset.idx) === s.idx));
  try { history.replaceState(null, '', `#suite-${s.code}`); } catch (e) { /* sandboxed */ }
  if (enter) enterRoom(s);
  else { if (STATE.mode === 'room') exitRoom(false); if (STATE.cut !== s.floorIdx) viewFloor(s.floorIdx, fly); showHighlight(s); }
  $('enterRoom').textContent = STATE.mode === 'room' ? 'Back to floor' : 'Walk in';
}
function enterRoom(s) {
  setCut(null); BUILD.crown.visible = true;
  STATE.mode = 'room'; STATE.suite = s; highlight.visible = false;
  const big = s.big, eye = s.floorIdx === 0 ? 3.4 : Math.min(s.H - 0.6, 2.9);
  const inside = toWorld(s, -s.L / 2 + (big ? 3.0 : 2.0), eye, -s.S / 2 + (big ? 2.3 : 1.7));
  const look = toWorld(s, s.L * (big ? 0.1 : 0.15), 0.9, s.S * 0.12);
  const outside = toWorld(s, -s.L / 2 + 1.5, eye + 4, -s.S / 2 - 14);
  camera.near = 0.05; camera.updateProjectionMatrix();
  controls.minDistance = 0.2; controls.maxDistance = Math.hypot(s.L, s.S) * 0.6; controls.maxPolarAngle = Math.PI * 0.62;
  flyTo(inside, look, 2.4, outside);
  roomLights[0].position.copy(toWorld(s, -s.L / 4, s.H - 0.3, 0.5)); roomLights[1].position.copy(toWorld(s, s.L / 4, s.H - 0.3, 0.5));
  roomLights.forEach(l => { l.userData.base = big ? 11 : 7; l.intensity = l.userData.base * (TIMES[STATE.time].moon ? 0.45 : 1); l.distance = big ? 22 : 14; l.decay = 1.2; });
  U.glow.value = TIMES[STATE.time].glow + 0.1; bloom.strength = TIMES[STATE.time].bloom * 0.4;
  $('enterRoom').textContent = 'Back to floor';
  $('hint').textContent = 'Drag to look around · Scroll to move · Arrow keys for the next suite';
}
function exitRoom(toFloor = true) {
  if (STATE.mode !== 'room') return;
  STATE.mode = 'orbit';
  camera.near = 0.5; camera.updateProjectionMatrix();
  controls.minDistance = 3; controls.maxDistance = 1100; controls.maxPolarAngle = Math.PI * 0.6;
  roomLights.forEach(l => { l.intensity = 0; });
  U.glow.value = TIMES[STATE.time].glow; bloom.strength = TIMES[STATE.time].bloom;
  $('enterRoom').textContent = 'Walk in';
  $('hint').textContent = 'Drag to orbit · Scroll to zoom · Right-drag to pan · Click the tower to open a suite';
  if (toFloor && STATE.suite) { viewFloor(STATE.suite.floorIdx); showHighlight(STATE.suite); }
}
function showHighlight(s) {
  if (!s) { highlight.visible = false; return; }
  const b = s.box; highlight.position.set((b.x0 + b.x1) / 2, s.y + s.H / 2, (b.z0 + b.z1) / 2); highlight.scale.set(b.x1 - b.x0, s.H, b.z1 - b.z0); highlight.visible = true;
}
function stepSuite(d) { const i = STATE.suite ? STATE.suite.idx : -1; const order = [...SUITES].sort((a, b) => a.f - b.f || a.s.localeCompare(b.s)); const pos = order.findIndex(s => s.idx === i); const n = order[(pos + d + order.length) % order.length]; selectSuite(n, { enter: STATE.mode === 'room' || !!STATE.tour }); }
function closeCard() { $('card').hidden = true; highlight.visible = false; STATE.suite = null; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } }

// ---------- picking ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane();
function pickSuite(ev) {
  const r = $('scene').getBoundingClientRect(); ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const proxies = BUILD.proxies.filter((p, i) => STATE.cut == null || i <= STATE.cut);
  const hit = ray.intersectObjects(proxies, false)[0]; if (!hit) return null;
  let i = hit.object.userData.floor, p = hit.point;
  if (STATE.cut != null && i === STATE.cut) { plane.set(UP, -floorY(i)); const q = new THREE.Vector3(); if (ray.ray.intersectPlane(plane, q)) p = q; }
  let slot = null; if (p.x < -6.5) slot = 'A'; else if (p.x > 6.5) slot = 'B'; else if (i % 2 === 0 && p.z > 5.5) slot = 'C';
  return slot ? SUITES.find(s => s.f === i + 1 && s.s === slot) : null;
}

// ---------- UI ----------
function buildUI() {
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.pane !== b.dataset.tab; });
  }));
  document.querySelectorAll('#viewGrid .btn').forEach(b => b.addEventListener('click', () => { stopTour(); goView(b.dataset.view); }));
  document.querySelectorAll('#timeSeg button').forEach(b => b.addEventListener('click', () => setTime(b.dataset.time)));
  $('optOrbit').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
  $('optGlow').addEventListener('change', (e) => { bloom.enabled = e.target.checked; });
  $('optShadow').addEventListener('change', (e) => { sun.castShadow = e.target.checked; renderer.shadowMap.needsUpdate = true; });
  const elev = $('elevator');
  for (const row of [[17, 18, 19, 20], [13, 14, 15, 16], [9, 10, 11, 12], [5, 6, 7, 8], [1, 2, 3, 4]]) for (const f of row) {
    const b = document.createElement('button'); b.textContent = f === 1 ? 'L' : f; b.dataset.floor = f - 1; b.setAttribute('aria-label', `Floor ${f}${f === 1 ? ', lobby' : ''}`);
    b.addEventListener('click', () => { stopTour(); closeCard(); viewFloor(f - 1); }); elev.appendChild(b);
  }
  $('allFloors').addEventListener('click', () => { stopTour(); closeCard(); goView('overview'); });
  const list = $('roomList');
  const render = (q = '') => {
    q = q.trim().toLowerCase(); list.innerHTML = '';
    for (let f = 20; f >= 1; f--) {
      const items = SUITES.filter(s => s.f === f && (!q || `${s.n} ${s.use} ${s.code}`.toLowerCase().includes(q)));
      if (!items.length) continue;
      const g = document.createElement('div'); g.className = 'room-floor';
      g.innerHTML = `<h4>Floor ${pad2(f)}${f === 1 ? ' · Lobby' : ''}</h4>`;
      items.forEach(s => { const b = document.createElement('button'); b.className = 'room-item'; b.dataset.idx = s.idx; b.innerHTML = `<span class="code">${s.code}</span><span class="nm">${s.n}</span>`; b.addEventListener('click', () => { stopTour(); selectSuite(s, { enter: true }); if (IS_MOBILE) togglePanel(false); }); g.appendChild(b); });
      list.appendChild(g);
    }
    if (!list.children.length) list.innerHTML = '<p class="note">No suite matches that search. Try a floor number like “12” or a word like “lounge”.</p>';
  };
  render(); $('roomSearch').addEventListener('input', (e) => render(e.target.value));
  $('cardClose').addEventListener('click', () => { stopTour(); if (STATE.mode === 'room') exitRoom(true); closeCard(); });
  $('prevRoom').addEventListener('click', () => { stopTour(); stepSuite(-1); });
  $('nextRoom').addEventListener('click', () => { stopTour(); stepSuite(1); });
  $('enterRoom').addEventListener('click', () => { stopTour(); if (STATE.mode === 'room') exitRoom(true); else if (STATE.suite) selectSuite(STATE.suite, { enter: true }); });
  $('tourBtn').addEventListener('click', () => (STATE.tour ? stopTour() : startTour()));
  const toggle = $('panelToggle');
  toggle.addEventListener('click', () => togglePanel($('panel').classList.contains('collapsed')));
  if (IS_MOBILE) togglePanel(false);
  if (window.self !== window.top) $('glbBtn').hidden = true;
  $('glbBtn').addEventListener('click', exportGLB);
  // canvas interaction
  const cv = $('scene'); let down = null;
  cv.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; if (STATE.fly) STATE.fly = null; stopTour(); });
  cv.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || e.button !== 0) { down = null; return; }
    down = null; if (STATE.mode === 'room') return;
    const s = pickSuite(e);
    if (s) { if (STATE.suite === s && STATE.cut === s.floorIdx) selectSuite(s, { enter: true }); else selectSuite(s); }
  });
  let raf = 0;
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || e.buttons || STATE.mode === 'room') { $('tip').hidden = true; return; }
    if (raf) return; raf = requestAnimationFrame(() => {
      raf = 0; const s = pickSuite(e), tip = $('tip');
      if (s) { tip.innerHTML = `<b>${s.code}</b>${s.n}`; tip.style.left = `${e.clientX}px`; tip.style.top = `${e.clientY}px`; tip.hidden = false; cv.style.cursor = 'pointer'; if (!STATE.suite || STATE.suite.floorIdx === s.floorIdx || STATE.cut == null) showHighlight(s); }
      else { tip.hidden = true; cv.style.cursor = ''; if (STATE.suite && STATE.mode !== 'room') showHighlight(STATE.suite); else highlight.visible = false; }
    });
  });
  cv.addEventListener('pointerleave', () => { $('tip').hidden = true; });
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') { stopTour(); if (STATE.mode === 'room') exitRoom(true); else if (STATE.cut != null) { closeCard(); goView('overview'); } }
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && STATE.suite) { stopTour(); stepSuite(e.key === 'ArrowRight' ? 1 : -1); }
  });
}
function togglePanel(open) { $('panel').classList.toggle('collapsed', !open); $('panelToggle').setAttribute('aria-expanded', String(open)); $('panelToggle').textContent = open ? 'Hide controls' : 'Controls'; if (camera) applyViewOffset(); }
function startTour() {
  const order = [...SUITES].sort((a, b) => a.f - b.f || a.s.localeCompare(b.s));
  let k = STATE.suite ? order.findIndex(s => s.idx === STATE.suite.idx) : 0;
  const go = () => { selectSuite(order[k % order.length], { enter: true }); k++; };
  STATE.tour = setInterval(go, 9000); go();
  $('tourBtn').textContent = 'Stop suite tour';
}
function stopTour() { if (!STATE.tour) return; clearInterval(STATE.tour); STATE.tour = null; $('tourBtn').textContent = 'Start suite tour'; }

async function exportGLB() {
  const btn = $('glbBtn'); btn.disabled = true; btn.textContent = 'Preparing model…';
  try {
    const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
    const prevCut = STATE.cut; setCut(null);
    const root = new THREE.Group(); root.add(BUILD.tower.clone(), SITE.group.clone());
    root.traverse(o => {
      if (o.isPoints) o.visible = false;
      const c = o.isMesh && o.geometry.attributes.color;
      if (!c || c.itemSize !== 3) return;
      // glTF needs 4-byte aligned vertex elements and colours in 0–1: write RGBA8 / clamped floats
      const g = o.geometry.clone(), n = c.count;
      if (c.array instanceof Uint8Array) { const a = new Uint8Array(n * 4); for (let i = 0; i < n; i++) { a[i * 4] = c.array[i * 3]; a[i * 4 + 1] = c.array[i * 3 + 1]; a[i * 4 + 2] = c.array[i * 3 + 2]; a[i * 4 + 3] = 255; } g.setAttribute('color', new THREE.BufferAttribute(a, 4, true)); }
      else { const a = new Float32Array(c.array.length); for (let i = 0; i < a.length; i++) a[i] = Math.min(1, c.array[i]); g.setAttribute('color', new THREE.BufferAttribute(a, 3)); }
      o.geometry = g;
    });
    const res = await new GLTFExporter().parseAsync(root, { binary: true, onlyVisible: true, maxTextureSize: 1024 });
    const url = URL.createObjectURL(new Blob([res], { type: 'model/gltf-binary' }));
    const a = document.createElement('a'); a.href = url; a.download = 'TRUGS-headquarters.glb'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setCut(prevCut);
    btn.textContent = 'Model exported';
  } catch (err) { console.error(err); btn.textContent = 'Export failed — try again'; }
  setTimeout(() => { btn.disabled = false; btn.textContent = 'Export model (.glb)'; }, 3000);
}

// ---------- frame loop ----------
const clock = new THREE.Clock();
let perf = { n: 0, t: 0, checked: false };
function frame() {
  requestAnimationFrame(frame);
  if (window.TRUGS && window.TRUGS.paused) return;
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  U.time.value = t;
  T.waterN.offset.set(t * 0.013, t * 0.009);
  if (SITE.fallTex) SITE.fallTex.offset.set(0, t * 0.45);
  for (const f of SITE.anim) f(t, dt);
  for (const F of SITE.flags) { const p = F.flag.geometry.attributes.position, b = F.base; for (let i = 0; i < p.count; i++) { const x = b[i * 3], y = b[i * 3 + 1]; p.array[i * 3 + 2] = Math.sin(x * 1.7 - t * 3.2 + F.ph + y * 0.4) * 0.16 * (x / 3.4); } p.needsUpdate = true; F.flag.geometry.computeVertexNormals(); }
  if (BUILD.beacon) BUILD.beacon.visible = (t % 1.8) < 0.3;
  if (STATE.fly) {
    const F = STATE.fly, k = Math.min(1, (performance.now() - F.start) / F.dur), e = ease(k);
    if (F.curve) camera.position.copy(F.curve.getPoint(e)); else camera.position.lerpVectors(F.p0, F.pos, e);
    controls.target.lerpVectors(F.t0, F.target, e); camera.lookAt(controls.target);
    if (k >= 1) { STATE.fly = null; controls.update(); F.done?.(); }
  } else controls.update();
  if (STATE.mode !== 'room' && camera.position.y < 1.4) camera.position.y = 1.4; // keep the orbit above ground
  if (STATE.mode === 'room' && STATE.suite && !STATE.fly) {
    const s = STATE.suite, b = s.box, m = 0.35;
    camera.position.x = THREE.MathUtils.clamp(camera.position.x, b.x0 + m, b.x1 - m);
    camera.position.z = THREE.MathUtils.clamp(camera.position.z, b.z0 + m, b.z1 - m);
    camera.position.y = THREE.MathUtils.clamp(camera.position.y, s.y + 0.5, s.y + s.H - 0.25);
  }
  composer.render(dt);
  if (!perf.checked) { perf.n++; perf.t += dt; if (perf.t > 4) { perf.checked = true; const fps = perf.n / perf.t; if (fps < 28 && renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); resize(); } } }
}

// ---------- boot ----------
async function boot() {
  try {
    initRenderer();
  } catch (e) {
    ui.text.innerHTML = '<span class="ld-err">This model needs WebGL 2. Open the page in a recent version of Chrome, Edge, Safari or Firefox with hardware acceleration turned on.</span>';
    return;
  }
  try {
    const jobs = makeTextures();
    for (let k = 0; k < jobs.length; k++) { await jobs[k](); if (k % 4 === 0) { setProgress(0.03 + 0.25 * k / jobs.length, 'Mixing marble, timber and terrazzo'); await tick(); } }
    makeMaterials();
    initComposer(); initSkyAndLights();
    highlight = new THREE.Group();
    const hb = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xe6c98e, transparent: true, opacity: 0.1, depthWrite: false }));
    const he = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color: 0xe6c98e, transparent: true, opacity: 0.9 }));
    highlight.add(hb, he); highlight.visible = false; highlight.renderOrder = 5; scene.add(highlight);
    setProgress(0.3, 'Pouring the foundation');
    await tick();
    const site = await buildSite((m) => setProgress(0.34, m)); scene.add(site);
    setProgress(0.4, 'Raising floor 01');
    const tower = await buildTower((i, s) => setProgress(0.4 + 0.52 * (i + 1) / FLOORS, `Furnishing floor ${pad2(i + 1)} · ${s.n}`));
    scene.add(tower);
    setTime('day'); resize(); buildUI();
    setProgress(0.95, 'Switching on the lights');
    await tick();
    renderer.compile(scene, camera);
    composer.render(0.016);
    addEventListener('resize', resize);
    ui.loader.classList.add('done'); setTimeout(() => ui.loader.remove(), 900);
    frame();
    const m = /^#suite-(\d{1,2}[ABC])$/i.exec(location.hash);
    const deep = m && SUITES.find(s => s.code.toUpperCase() === m[1].toUpperCase());
    if (deep) { camera.position.set(140, 70, 200); controls.target.set(0, 45, 0); selectSuite(deep, { enter: true }); }
    else goView('overview');
    const snap = (p, t, q = 0.85) => { if (p) { STATE.fly = null; camera.position.set(...p); controls.target.set(...t); camera.lookAt(controls.target); controls.update(); } for (const f of SITE.anim) f(1, 0.016); composer.render(0.016); return renderer.domElement.toDataURL('image/jpeg', q); };
    window.TRUGS = { THREE, snap, paused: false, VIEWS, STATE, SUITES, BUILD, SITE, setTime, goView, viewFloor, selectSuite, enterRoom, exitRoom, renderer, scene, camera, controls };
  } catch (err) {
    console.error(err);
    ui.text.innerHTML = `<span class="ld-err">The model could not finish building (${String(err && err.message || err).slice(0, 140)}). Reload the page to try again.</span>`;
  }
}
boot();
</script>
